<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六合彩攪珠模擬器</title>

    <style>
        body{
            font-family: Arial,sans-serif;
            background-color: #f0f2f5;
            display: flex; /*flex主佈局*/
            flex-direction: column;/*flex佈局*/
            align-items: center;/*flex佈局*/
            padding: 50px 0px; /*上下50,左右0*/
        } /*justify content is also flex佈局, 一delete display-flex,flex佈局就失效*/
 
        h1 {
            color: #130f0f;  /*文字:六合彩攪珠結果*/
        }

        .container {
            background: rgb(247, 246, 246);
            padding: 30px;
            border-radius: 15px;
            /*box-shadow: 10px 20px 15px rgba(0,0,0,3);*/
            text-align: center;
            max-width: 600px;
            width: 90%;
            border-style:ridge;
            border-color: #faf2f8;
            
        }

        .ball-container {/*7個球如果沒有.ball-container,會全部打直排列*/
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;/*球與球之間的距離*/
            margin: 30px 0;
            flex-wrap: wrap;
            
        }

        /*六合彩波膽樣式*/
        .ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), 2px 2px 5px rgba(227, 213, 213, 0.2);
            transition: transform 0.3s ease;
        }

        .plus {
            font-size: 30px;
            font-weight: bold;
            color: #666;
            margin: 0 5px;
        }

        .ball:hover {
            transform: scale(1.1);
        }

        /*分隔線*/
        .plus {
            font-size: 30px;
            font-weight: bold;
            color: #080816; /*'+'號的顏色*/
            align-self: center;
        }

        /*按鈕樣式*/
        button {
            padding: 12px 30px;/*攪珠按鈕向上下空間12px,左右係30px*/
            font-size: 18px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,123,255,0.2);

        }

        button:hover {
            background-color: #a1b300;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>六合彩攪珠結果</h1>

        <div class="ball-container" id="result-box">
            <!-- 號碼會透過 javascript 自動生成到這裡-->
             <p style="color: #888;">請點撃下方按鈕開始攪珠</p>
        </div>

        <button onclick="drawLottery()">開始攪珠</button>
    </div>

<script>
    //定義六合彩的三個顏色的號碼陣列
    const redBalls = [1,2,7,8,12,13,18,19,23,24,29,30];
    const blueBalls = [3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
    const greenBalls  = [5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49];

    //根據號碼判斷球的顏色
    function getBallColor(num) {
        if (redBalls.includes(num)) return'#ff4d4d';
        if (blueBalls.includes(num)) return '#3399ff';
        return '#2eb85c';
    }

    function drawLottery() {  //定義一個名為drawLottery的函數,當點撃'閞始攪珠'按鈕時會執行這個區塊
        //1.攪珠核心邏輯
        
        
        let pool = Array.from({length:49}, (_,i) => i+1);//建立一個包含1-49號的陣列(pool),用來當作彩球箱,
        //(_,i)的(_)意思係第一個數字唔要
        

        pool.sort(() =>Math.random() -0.5 );//洗牌,將箱中49個號碼打亂排序(模擬洗牌攪珠)
        let drawn = pool.slice(0,7); //從打亂的彩球箱中抽出最前面的7個號碼

        let normal = drawn.slice(0,6).sort((a,b)=> a-b); //複製前6個號碼(正選球),並將它由小至大排序(方便觀看)
        let special = drawn[6]; //取出第7個號碼(索引值為6,當作特別號碼)

        //2.顯示到網頁畫面上
        const container = document.getElementById('result-box');
        container.innerHTML = ''; //清空舊內容

        //產生6個正選球
        normal.forEach(num => { //使用forEach 迴圈,依序處理剛剛排序好的6個正選號碼
            const ball = document.createElement('div'); //在記憶體中建立一個新的<div>標籤元素
            ball.className = 'ball'; //為這個<div>加上名為'ball'的CSS類別(使其變成球的圖形外觀)
            ball.style.backgroundColor = getBallColor(num);//根據號碼呼叫getBallColor函數,並將取得的顏色(紅/藍/綠)設定為球的背景色
            ball.innerText = num; //將目前的號碼數字(num)寫入到球的內部文件中
            container.appendChild(ball); //將這類倣好的正選球,塞入網頁的容器(result-box)裡面顯示出來
        });

        //加入特別號碼的分隔符號
        const plusSign = document.createElement('span'); //在記憶體中建立一個新的<span>標籤元素,用來放文字
        plusSign.className = 'plus'; //為這個<span>加上名為'plus'的CSS類別(設定加號的字型大小與顏色)
        plusSign.innerText = "+"; //將這個標籤的文字內容設定為"+"號
       container.appendChild(plusSign); //將這個加號塞入網頁的容器中,接在6個正選球後面
 
        //產生特別號碼球
        const specialBall = document.createElement('div'); //在記憶體中建立一個新的<div>標籤元素,用來做特別號碼球
        specialBall.className = 'ball'; //為它加上名為'ball'的CSS類別, 讓它也有圓形球體外觀
        specialBall.style.backgroundColor = getBallColor(special); //根據特別號碼(special)呼叫函數,將取得的顏色設定為這顃球的背景的
        specialBall.innerText = special;//將特別號碼的數字寫入到球的內部文字中
        container.appendChild(specialBall); //將這類特別號碼球塞入網頁容器中,放在"+"號的最後面
    }



//console.log("正選 :", normal);
//console.log("特別號碼 :", special);

</script>
   
</body>
</html>
